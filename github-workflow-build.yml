name: Build Hekpixle Installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - name: Keep only the Setup exe
        shell: bash
        run: |
          mkdir release
          cp dist/Hekpixle-Setup-*.exe release/
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: Hekpixle-Setup
          path: release/Hekpixle-Setup-*.exe
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Hekpixle-Setup-*.exe
